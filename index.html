<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro - Tablero CRM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkborder: '#334155',
                        accent: '#3b82f6',
                        accenthover: '#2563eb',
                    }
                }
            }
        }
    </script>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-darkcard border border-darkborder rounded-2xl p-8 shadow-2xl text-center space-y-6">
        <div class="inline-flex p-4 bg-blue-500/10 text-blue-500 rounded-2xl border border-blue-500/20">
            <i data-lucide="shield-check" class="w-10 h-10"></i>
        </div>
        
        <div class="space-y-2">
            <h1 class="text-xl font-bold tracking-tight text-white">Acceso Restringido</h1>
            <p class="text-sm text-slate-400">Autenticación requerida para acceder al Tablero de Oportunidades CRM.</p>
        </div>

        <!-- Contenedor del Botón de Google Sign-In -->
        <div class="flex flex-col items-center justify-center space-y-4 pt-2">
            <div id="g_id_onload"
                 data-client_id="999999136448-dpep32pelr9on3tufokenmunaghoo9g9.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_select="true"
                 data-itp_support="true">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="filled_black"
                 data-text="sign_in_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>

        <div id="errorMessage" class="hidden p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-lg">
            Acceso no autorizado. La cuenta ingresada no cuenta con permisos para este tablero.
        </div>

        <p class="text-xs text-slate-500">
            Asegúrate de iniciar sesión con tu cuenta de Google autorizada.
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            // Verificar si ya hay una sesión activa válida en este navegador
            if (sessionStorage.getItem('crm_auth') === 'true') {
                window.location.href = 'tablero.html';
            }
        });

        // Función para decodificar el JWT de Google de manera segura
        function parseJwt(token) {
            try {
                var base64Url = token.split('.')[1];
                var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        // Callback cuando Google autentica exitosamente al usuario
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            
            if (!responsePayload) {
                showError();
                return;
            }

            const userEmail = responsePayload.email;
            
            // ==========================================
            // CONFIGURA AQUÍ TU CORREO AUTORIZADO
            // ==========================================
            const CORREO_AUTORIZADO = "test@gmail.com"; 

            if (userEmail && userEmail.toLowerCase() === CORREO_AUTORIZADO.toLowerCase()) {
                // Autenticación exitosa: guardamos sesión y redirigimos al tablero
                sessionStorage.setItem('crm_auth', 'true');
                sessionStorage.setItem('user_email', userEmail);
                window.location.href = 'tablero.html';
            } else {
                showError();
                console.warn("Intento de acceso denegado para:", userEmail);
            }
        }

        function showError() {
            const errDiv = document.getElementById('errorMessage');
            errDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
